<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasall AI Grader - Settings</title>
    <style>
        :root {
            --primary: #f84f4f; /* Pasall Red */
            --bg: #1e1e24; /* Dark mode bg matching Pasall */
            --surface: #2b2b36;
            --text: #ffffff;
            --text-muted: #a0a0b0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--surface);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            color: var(--primary);
            text-align: center;
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #1a1a20;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:hover {
            background-color: #e04444;
        }

        button:active {
            transform: scale(0.98);
        }

        #status {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            color: #4caf50;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #status.visible {
            opacity: 1;
        }

        .helper-text {
            margin-top: 16px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Pasall AI Grader</h1>
        <p class="subtitle">Configure your Gemini API settings</p>
        
        <div class="form-group">
            <label for="apiKey">Google Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="AIzaSy...">
        </div>
        
        <div class="form-group">
            <label for="modelSelect">AI Model</label>
            <select id="modelSelect" style="width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #444; background-color: #1a1a20; color: white; font-size: 16px; box-sizing: border-box; outline: none;">
                <option value="gemini-2.5-flash">Gemini 2.5 Flash (Fast)</option>
                <option value="gemini-2.5-pro">Gemini 2.5 Pro (More accurate)</option>
                <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro (Latest)</option>
            </select>
        </div>
        
        <button id="saveBtn">Save Settings</button>
        <div id="status">Settings saved successfully!</div>

        <div class="helper-text">
            Don't have an API key? You can get one for free at <br>
            <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>.<br><br>
            Your key is stored securely on your local browser and is never sent anywhere except directly to Google for processing.
        </div>
    </div>

    <script src="options.js"></script>
</body>
</html>
